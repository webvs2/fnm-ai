name: "debug"

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit SHA or ref to debug. Defaults to the workflow ref."
        required: false
      artifact_branch:
        description: "Branch to search for rust.yml artifacts. Defaults to the current branch."
        required: false

concurrency:
  group: debug
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  e2e_windows_debug:
    runs-on: windows-latest
    name: "e2e/windows/debug"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.ref }}
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: rust.yml
          workflow_conclusion: ""
          branch: ${{ inputs.artifact_branch || github.ref_name }}
          name: "fnm-windows"
          path: "target/release"
          if_no_artifact_found: ignore
      - uses: hecrj/setup-rust-action@v2
        if: steps.download-artifact.outputs.artifact-found != 'true'
        with:
          rust-version: stable
      - uses: Swatinem/rust-cache@v2
        if: steps.download-artifact.outputs.artifact-found != 'true'
      - name: Build release binary
        if: steps.download-artifact.outputs.artifact-found != 'true'
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
      - uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - name: 🐛 Debug Build
        if: always()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
